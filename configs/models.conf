# Model catalog for dictation-setup (Phase D).
#
# Data, not code: when HuggingFace moves a file this is a one-line edit rather
# than a recompile. Pipe-separated because a record has 6 fields, which
# key=value handles badly.
#
#   kind|id|display name|filename|url|size_bytes
#
#   kind        "whisper" or "llama" -- which of the two lists the entry appears in
#   id          stable short name, used by --fetch-model and never shown as a label
#   display     the label shown in the setup window
#   filename    basename under models/; also what whisper_model_path/llama_model_path get
#   url         direct download URL (curl -L --fail)
#   size_bytes  ADVISORY, progress bar only. 0 = unknown -> the bar degrades to a
#               plain byte counter. A stale size never breaks a download.
#
# Blank lines and whole-line '#' comments are skipped. Unlike config.c, a '#'
# *within* a line is NOT treated as a comment -- URLs and display names may
# legitimately contain one.

