# Model catalog for dictation-setup (Phase D).
#
# Data, not code: when HuggingFace moves a file this is a one-line edit rather
# than a recompile. Pipe-separated because a record has 6 fields, which
# key=value handles badly.
#
#   kind|id|display name|filename|url|size_bytes
#
#   kind        "whisper" or "llama" -- which of the two lists the entry appears in
#   id          stable short name, used by --fetch-model and never shown as a label
#   display     the label shown in the setup window
#   filename    basename under models/; also what whisper_model_path/llama_model_path get
#   url         direct download URL (curl -L --fail)
#   size_bytes  ADVISORY, progress bar only. 0 = unknown -> the bar degrades to a
#               plain byte counter. A stale size never breaks a download.
#
# Blank lines and whole-line '#' comments are skipped. Unlike config.c, a '#'
# *within* a line is NOT treated as a comment -- URLs and display names may
# legitimately contain one.

# Whisper runs on the CPU backend here (use_gpu=false -- see the LDLIBS comment
# in the Makefile), so the sizes below cost RAM and load time, not VRAM.
whisper|large-v3-turbo-q5_0|large-v3-turbo q5_0 (recommended)|ggml-large-v3-turbo-q5_0.bin|https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin|574041195
whisper|large-v3-turbo|large-v3-turbo (unquantized, 1.6 GB)|ggml-large-v3-turbo.bin|https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo.bin|1624555275
whisper|medium.en|medium.en (English-only, 1.5 GB)|ggml-medium.en.bin|https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-medium.en.bin|1533774781
whisper|base.en|base.en (faster, less accurate)|ggml-base.en.bin|https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin|147964211

# Cleanup models DO go on the GPU (n_gpu_layers=99), so file size here is
# roughly VRAM cost -- add ~300 MB compute buffer plus KV cache on top. The
# sizes are called out in the display names because that is the only place the
# user sees them before committing to a multi-GB download.
#
# "Gemma 3n E2B" is the model commonly asked for as "gemma 4 e2b": there is no
# Gemma 4, and E2B is Gemma 3n's MatFormer designation for ~2B *effective*
# parameters out of ~5B raw -- which is why the file is far larger than a
# conventional 2B. Requires LLM_ARCH_GEMMA3N, present in the pinned llama.cpp
# (llama.cpp/src/models/gemma3n.cpp).
llama|qwen2.5-1.5b-q4km|Qwen2.5-1.5B-Instruct Q4_K_M (1.0 GB)|Qwen2.5-1.5B-Instruct-Q4_K_M.gguf|https://huggingface.co/bartowski/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf|1117320736
llama|gemma-3n-e2b-q3km|Gemma 3n E2B Q3_K_M (2.3 GB, fits 4 GB VRAM)|gemma-3n-E2B-it-Q3_K_M.gguf|https://huggingface.co/unsloth/gemma-3n-E2B-it-GGUF/resolve/main/gemma-3n-E2B-it-Q3_K_M.gguf|2483178848
llama|gemma-3n-e2b-q4km|Gemma 3n E2B Q4_K_M (2.8 GB, tight on 4 GB VRAM)|gemma-3n-E2B-it-Q4_K_M.gguf|https://huggingface.co/unsloth/gemma-3n-E2B-it-GGUF/resolve/main/gemma-3n-E2B-it-Q4_K_M.gguf|3026881888
