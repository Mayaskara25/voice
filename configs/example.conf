# Push-to-talk dictation daemon config
# key=value, '#' starts a comment, blank lines ignored.

whisper_model_path=./models/ggml-base.en.bin

# LLM cleanup (Phase B): path to a llama.cpp instruct GGUF. When set, the raw
# whisper transcript is passed through the model to fix casing/punctuation before
# injection. Leave BLANK to disable cleanup entirely (raw whisper output is used).
llama_model_path=./models/Qwen2.5-1.5B-Instruct-Q4_K_M.gguf

# Cleanup style (only used when llama_model_path is set):
#   dictation - fix casing/punctuation only, never alter wording (default)
#   code      - minimal changes, preserve identifiers/symbols, no prose punctuation
#   commands  - emit a concise shell/command line, spoken punctuation -> symbols
cleanup_style=dictation

# GPU offload for the cleanup model: number of transformer layers on the GPU.
# 99 = offload all (needs a CUDA build + enough VRAM; Qwen2.5-1.5B Q4_K_M ~1GB
# fits the GTX 1650's 4GB). 0 = CPU-only (much slower). Ignored if cleanup is off.
n_gpu_layers=99

# Leave blank to auto-detect a keyboard device under /dev/input/.
# Set explicitly (e.g. /dev/input/event3) if auto-detect picks the wrong device --
# run `./dictation --list-keys` to see which device your key events come from.
ptt_device=

# evdev key code for push-to-talk (NOT an X keysym/keycode -- see PLAN.md).
# Discover this by running `./dictation --list-keys` and pressing your desired key.
# Default below (97) is KEY_RIGHTCTRL.
ptt_keycode=97

# Leave blank to auto-detect the first capture-capable ALSA card (as
# "plughw:<card>,<dev>" -- deliberately NOT "default", see PLAN.md: on this
# machine PipeWire's "default" node was found to corrupt/clip 16kHz mono
# capture regardless of mixer gain). Set explicitly (e.g. plughw:2,0) if you
# have multiple capture devices (e.g. a USB webcam mic) and auto-detect picks
# the wrong one -- check `arecord -l` for the card/device numbers.
audio_device=

n_threads=8

# Fixed to English for now.
language=en

# true: print the transcript to stdout instead of injecting keystrokes.
test_mode=false

# true: also show the microui/Xlib status panel (Phase C). The panel is an
# override-redirect window that never takes input focus, so injected keystrokes
# still land in whatever app you were looking at. Can also be forced with --gui.
gui_enabled=false

# X core font for the status panel (XLFD or alias). Leave blank for "fixed".
# Examples: "9x15", "-*-helvetica-medium-r-*-*-14-*-*-*-*-*-*-*". List with `xlsfonts`.
gui_font=
